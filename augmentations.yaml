augmentations:

  - type: PitchShift
    min_semitones: -4
    max_semitones: 4
    probability: 0.2

  - type: TimeStretch
    min_rate: 0.8
    max_rate: 1.2
    probability: 0.2

  - type: ApplyImpulseResponse
    ir_path: "selectedImpulseResponses"
    probability: 0.2

  - type: AddGaussianNoise
    min_amplitude: 0.005
    max_amplitude: 0.025
    probability: 0.2

  - type: TimeMask
    min_band_part: 0.05
    max_band_part: 0.15
    fade: true
    probability: 0.2

  - type: ClippingDistortion
    min_percentile_threshold: 10
    max_percentile_threshold: 50
    probability: 0.2

  - type: Shift
    min_shift: -0.5
    max_shift: 0.5
    rollover: true
    probability: 0.2

  - type: Gain
    min_gain_db: -12.0
    max_gain_db: 6.0
    probability: 0.2

  - type: HighPassFilter
    min_cutoff_freq: 100
    max_cutoff_freq: 500
    probability: 0.2

  - type: Mp3Compression
    min_bitrate: 8
    max_bitrate: 128
    probability: 0.2

  - type: LowPassFilter
    min_cutoff_freq: 4000
    max_cutoff_freq: 8000
    probability: 0.2

  - type: PolarityInversion
    probability: 0.2

